openapi: 3.0.3
info:
  title: Majoo Monthly Revenue Reporting API
  description: |
    RESTful API for multi-tenant merchant revenue reporting engine built with Laravel 11 and JWT Authentication.
    
    ### Features:
    - **Authentication**: JWT Login & Logout (`/api/auth/*`)
    - **Strict Multi-Tenancy**: Data isolation per merchant via JWT token
    - **Revenue Reporting Engine**: Paginated daily revenue (omzet = `SUM(bill_total)`) with zero-fill for days with no transactions.
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Local Docker Development Server

paths:
  /api/auth/login:
    post:
      summary: User Login
      description: Authenticate merchant user with email and password to receive a JWT access token.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: merchant1@mail.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Login successful.
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                      token_type:
                        type: string
                        example: Bearer
                      expires_in:
                        type: integer
                        example: 3600
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          email:
                            type: string
                            example: merchant1@mail.com
                          merchant_id:
                            type: integer
                            example: 1
                          merchant:
                            type: string
                            example: merchant 1
        '401':
          description: Invalid credentials
        '422':
          description: Validation error

  /api/auth/logout:
    post:
      summary: User Logout
      description: Invalidate current JWT token.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully
        '401':
          description: Unauthorized

  /api/merchant/report:
    get:
      summary: Merchant Monthly Revenue Report
      description: |
        Generate monthly daily revenue report for the authenticated merchant.
        **Constraint**: Includes pagination and displays `0` revenue for dates with no transactions.
      tags:
        - Reporting
      security:
        - BearerAuth: []
      parameters:
        - name: month
          in: query
          description: Target month (1–12). Defaults to 11 (November).
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 11
            example: 8
        - name: year
          in: query
          description: Target year. Defaults to current year.
          required: false
          schema:
            type: integer
            example: 2026
        - name: page
          in: query
          description: Page number for pagination.
          required: false
          schema:
            type: integer
            default: 1
            example: 1
        - name: per_page
          in: query
          description: Number of days per page (max 31).
          required: false
          schema:
            type: integer
            default: 10
            example: 10
      responses:
        '200':
          description: Merchant report retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Merchant revenue report retrieved successfully.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                          example: "2026-08-01"
                        revenue:
                          type: number
                          example: 4500
                  meta:
                    type: object
                    properties:
                      month:
                        type: integer
                        example: 8
                      year:
                        type: integer
                        example: 2026
                      current_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 10
                      total_days:
                        type: integer
                        example: 31
                      total_pages:
                        type: integer
                        example: 4
        '401':
          description: Unauthorized

  /api/outlet/{outlet_id}/report:
    get:
      summary: Outlet Monthly Revenue Report
      description: |
        Generate monthly daily revenue report for a specific outlet.
        **Security**: Returns `403 Forbidden` if the requested outlet does not belong to the authenticated merchant.
      tags:
        - Reporting
      security:
        - BearerAuth: []
      parameters:
        - name: outlet_id
          in: path
          description: ID of the outlet
          required: true
          schema:
            type: integer
            example: 1
        - name: month
          in: query
          description: Target month (1–12). Defaults to 8 (August).
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 8
            example: 8
        - name: year
          in: query
          description: Target year. Defaults to current year.
          required: false
          schema:
            type: integer
            example: 2026
        - name: page
          in: query
          description: Page number for pagination.
          required: false
          schema:
            type: integer
            default: 1
            example: 1
        - name: per_page
          in: query
          description: Number of days per page (max 31).
          required: false
          schema:
            type: integer
            default: 10
            example: 10
      responses:
        '200':
          description: Outlet report retrieved successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (You do not have access to this outlet)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT Bearer token received from `/api/auth/login`.
