version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: majoo_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reporting_db
    ports:
      - "3306:3306"
    volumes:
      - majoo_mysql_data:/var/lib/mysql
      - ./case2-php/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  majoo_mysql_data:
