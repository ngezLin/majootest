services:
  # MySQL Database (shared for both reporting_db and blog_db)
  mysql:
    image: mysql:8.0
    container_name: majoo_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reporting_db
    ports:
      - "3307:3306"
    volumes:
      - majoo_mysql_data:/var/lib/mysql
      - ./case2-php/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - majoo_network

  # PHP Laravel Reporting API (Case 2 - PHP)
  php-app:
    build:
      context: ./case2-php
      dockerfile: Dockerfile
    container_name: majoo_php_app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: reporting_db
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./case2-php:/var/www
    networks:
      - majoo_network

  # Go Blog REST API (Case 2 - Go)
  go-app:
    build:
      context: ./case2-go
      dockerfile: Dockerfile
    container_name: majoo_go_app
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: blog_db
      JWT_SECRET: test123
      JWT_EXPIRY_HOURS: 24
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - majoo_network

networks:
  majoo_network:
    driver: bridge

volumes:
  majoo_mysql_data:
